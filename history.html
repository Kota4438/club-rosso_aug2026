<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60年の歩み - 吉沢孝太郎"祝還暦"イベント</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <style>
        .history-construction-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 30px 20px;
            text-align: center;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .construction-status {
            display: inline-block;
            background: #8b0000;
            color: #fff;
            padding: 6px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 50px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .history-main-title {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .history-lead {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.8;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        /* 各セクションのタイトルスタイル */
        .history-section-title {
            font-size: 1.3rem;
            color: #d4af37;
            font-weight: bold;
            margin: 40px 0 15px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* スライドショーのレイアウト */
        .slider-container {
            position: relative;
            max-width: 500px;
            margin: 0 auto 20px auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f7f7f7;
            border-radius: 4px;
        }
        .slider-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* 左右のめくりボタン */
        .slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .slide-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        .btn-prev { left: 25px; }
        .btn-next { right: 25px; }
        
        .slide-counter {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #666;
            font-weight: bold;
        }

        .back-to-profile {
            display: inline-block;
            margin-top: 40px;
            color: #8b0000;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body style="padding-top: 110px;">

    <!-- ナビゲーションメニュー -->
    <header>
        <nav class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="logo.jpg" alt="Celebrating 60th Birthday" class="logo-img">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Top</a></li>
                <li><a href="access.html">Access</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="ticket.html" class="btn-ticket">Ticket</a></li>
            </ul>
        </nav>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="main-content">
        <div class="history-construction-container">
            <span class="construction-status">COMING SOON</span>
            <h2 class="history-main-title">吉沢孝太郎 60年の歩み</h2>
            <p class="history-lead">公開まで今しばらくお待ちください。</p>

            <hr style="border: 0; border-top: 1px dashed #eee; margin: 30px 0;">

            <!-- 📸 セクション1：「昭和のヒーローｓ」 -->
            <h3 class="history-section-title">👉 昭和のヒーローｓ｜Heroes of the Showa Era</h3>
            <div class="slider-container">
                <div class="slider-wrapper">
                    <img src="hero (1).JPEG" alt="昭和のヒーロー" id="hero-img">
                </div>
                <button class="slide-btn btn-prev" onclick="changeHeroSlide(-1)">&lt;</button>
                <button class="slide-btn btn-next" onclick="changeHeroSlide(1)">&gt;</button>
                <div class="slide-counter" id="hero-counter">1 / 12</div>
            </div>

            <hr style="border: 0; border-top: 1px dashed #eee; margin: 30px 0;">

            <!-- 📸 セクション2：「昭和の夏の思い出」 -->
            <div class="slider-container">
                <!-- 💡 タイトルをスライドコンテナの内側に収めてすっきり配置 -->
                <h3 class="history-section-title" style="margin-top: 10px;">👉 昭和の夏の思い出｜Memories of Showa Summers</h3>
                <div class="slider-wrapper">
                    <img src="1.JPEG" alt="昭和の夏の思い出" id="summer-img">
                </div>
                <button class="slide-btn btn-prev" onclick="changeSummerSlide(-1)">&lt;</button>
                <button class="slide-btn btn-next" onclick="changeSummerSlide(1)">&gt;</button>
                <!-- 💡 写真の総数を 29枚 から 33枚 に変更 -->
                <div class="slide-counter" id="summer-counter">1 / 33</div>
            </div>

            <p>
                <a href="profile.html" class="back-to-profile">← プロフィールページに戻る</a>
            </p>
        </div>
    </main>

    <footer>
        <p>© 2026 Event Organizer. All Rights Reserved.</p>
    </footer>

    <!-- スライド独立切り替えプログラム -->
    <script>
        // ==========================================
        // 1. 昭和のヒーローｓ（全12枚）の制御
        // ==========================================
        const heroList = [
            "hero (1).JPEG", "hero (11).JPEG", "hero (10).JPEG", "hero (2).JPEG",
            "hero (12).JPEG", "hero (13).JPEG", "hero (14).JPEG", "hero (15).JPEG",
            "hero (16).JPEG", "(1).jpg", "(2).jpg", "(3).jpg"
        ];
        let heroIndex = 0;
        const heroImg = document.getElementById('hero-img');
        const heroCounter = document.getElementById('hero-counter');

        function changeHeroSlide(direction) {
            heroIndex += direction;
            if (heroIndex < 0) heroIndex = heroList.length - 1;
            if (heroIndex >= heroList.length) heroIndex = 0;
            heroImg.src = heroList[heroIndex];
            heroCounter.textContent = `${heroIndex + 1} / ${heroList.length}`;
        }

        // ==========================================
        // 2. 昭和の夏の思い出（全33枚）の制御
        // ==========================================
        // 💡 31.JPEG 〜 34.JPEG の追加分を組み込んだ正確な配列リスト（25は除外）
        const summerList = [
            "1.JPEG", "2.JPEG", "3.JPEG", "4.JPEG", "5.JPEG", "6.JPEG", "7.JPEG", "8.JPEG", "9.JPEG", "10.JPEG",
            "11.JPEG", "12.JPEG", "13.JPEG", "14.JPEG", "15.JPEG", "16.JPEG", "17.JPEG", "18.JPEG", "19.JPEG", "20.JPEG",
            "21.JPEG", "22.JPEG", "23.JPEG", "24.JPEG", "26.JPEG", "27.JPEG", "28.JPEG", "29.JPEG", "30.JPEG",
            "31.JPEG", "32.JPEG", "33.JPEG", "34.JPEG"
        ];
        
        let summerIndex = 0;
        const summerImg = document.getElementById('summer-img');
        const summerCounter = document.getElementById('summer-counter');

        function changeSummerSlide(direction) {
            summerIndex += direction;
            if (summerIndex < 0) summerIndex = summerList.length - 1;
            if (summerIndex >= summerList.length) summerIndex = 0;
            summerImg.src = summerList[summerIndex];
            summerCounter.textContent = `${summerIndex + 1} / ${summerList.length}`;
        }
    </script>

</body>
</html>
