<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チケット情報 ｜ 吉沢孝太郎"祝還暦"イベント 特設サイト</title>
    <!-- ⚠️ 検索エンジンに絶対に登録させない設定 -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 🎨 デザイン性を高めた御礼ページの追加スタイル */
        body {
            background-color: #121212;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding-top: 70px;
        }
        .thanks-container {
            max-width: 750px;
            margin: 50px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .thanks-card {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }
        /* 四隅のゴールドの装飾アクセント */
        .thanks-card::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1px dashed rgba(212, 175, 55, 0.4);
            border-radius: 6px;
            pointer-events: none;
        }
        .thanks-title {
            color: #d4af37;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .thanks-message {
            font-size: 1.05rem;
            line-height: 2;
            color: #e0e0e0;
            text-align: justify;
            margin-bottom: 40px;
            padding: 0 10px;
        }
        .thanks-signature {
            font-size: 0.95rem;
            color: #d4af37;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding-top: 20px;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }
        .back-btn {
            display: inline-block;
            padding: 14px 40px;
            background-color: #8b0000;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            letter-spacing: 1.5px;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(139, 0, 0, 0.4);
        }
        .back-btn:hover {
            background-color: #a00000;
            transform: translateY(-2px);
        }
        footer {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            padding: 30px 0;
        }
    </style>
</head>
<body>

    <!-- ナビゲーションメニュー -->
    <header>
        <nav class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="logo.jpg" alt="Celebrating 60th Birthday" class="logo-img">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Top</a></li>
                <li><a href="access.html">Access</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="ticket.html" class="active">Ticket</a></li>
            </ul>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="thanks-container">
        <div class="thanks-card">
            <h2 class="thanks-title">【満員御礼】イベント終了のご挨拶</h2>
            
            <div class="thanks-message">
                おかげさまで、当日は会場キャパシティを超える満席のお客様にお越しいただき、大盛況のうちに無事終了いたしました。<br>
                温かいご支援と素晴らしい時間をともに過ごしていただいたすべての皆様に、心より感謝申し上げます。
            </div>

            <div class="thanks-signature">
                吉沢孝太郎 還暦記念実行スタッフチームおよび関係者一同
            </div>

            <a href="index.html" class="back-btn">トップページに戻る</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Event Organizer. All Rights Reserved.</p>
    </footer>

</body>
</html>
